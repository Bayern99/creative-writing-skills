<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="nibGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <style>
    .bg-badge { fill: #1e1b4b; stroke: #312e81; }
    .quill-feather { fill: url(#featherGrad); }
    .quill-nib { fill: url(#nibGrad); }
    @media (prefers-color-scheme: light) {
      .bg-badge { fill: #4338ca; stroke: #3730a3; }
    }
  </style>

  <rect class="bg-badge" width="512" height="512" rx="112" stroke-width="4" />

  <g filter="url(#glow)">
    <!-- Quill Plume -->
    <path class="quill-feather" d="M 410 70 C 370 75 300 100 250 160 C 235 178 245 190 260 188 C 220 225 200 270 190 320 C 210 325 225 310 230 295 C 240 265 260 230 295 195 C 335 155 375 120 410 70 Z" opacity="0.95" />
    <path class="quill-feather" d="M 410 70 C 425 120 420 180 380 235 C 368 252 355 248 350 238 C 340 265 315 300 280 330 C 270 320 275 305 285 285 C 315 235 345 175 370 120 C 385 88 400 75 410 70 Z" opacity="0.88" />

    <!-- Feather spine / rachis -->
    <path d="M 410 70 C 360 140 290 240 220 340" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" />

    <!-- Quill Nib -->
    <path class="quill-nib" d="M 235 320 L 205 365 L 140 435 L 175 390 L 195 380 L 220 340 Z" stroke="#a16207" stroke-width="1.5" />
    <path d="M 140 435 L 180 395" stroke="#713f12" stroke-width="2" stroke-linecap="round" />
    <circle cx="180" cy="395" r="3.5" fill="#713f12" />

    <!-- Ink drop flourish -->
    <circle cx="125" cy="450" r="5" fill="url(#accentGrad)" />
    <circle cx="112" cy="462" r="2.5" fill="url(#accentGrad)" opacity="0.7" />
  </g>
</svg>
