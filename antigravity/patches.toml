[[patches]]
file = "skills/writing-staffing/SKILL.md"
sha256 = "78c68a2cfda20c8e4f3c5106081dac44730c495c4001a19c29c1e4c1148d2dfc"
description = "Replace meridian spawn and model family fan-out with native invoke_subagent"
search = """## Model Selection

Run every lane on its agent's default model. Lanes that look at different
angles, focus areas or characters are **parallel lanes**, and the different
prompts are what make them independent. Change a lane's model only when it
needs a capability its default lacks.

**Fan-out** is the exception: the same question and files sent to two model
families, for a high-stakes or disputed call where their different blind spots
are the point. A family is a provider: Opus, Sonnet and Fable are one family, so
two Anthropic models add no diversity. Your harness's own agent tool usually
reaches only its own provider, so fan out with `meridian spawn -m <model>`, and
check the live catalog (`meridian mars models list`) and its prompting guidance
(`meridian mars models prompting`) at dispatch time."""
replace = """## Model Selection & Multi-Agent Dispatch

In Antigravity, invoke agents via `invoke_subagent`. See `resources/antigravity-dispatch.md` for full dispatch patterns.

Deep creative drafting and critique subagents (`writer`, `critic`, `outliner`, `style-creator`, `kb-lead`) run on `model: pro` (Gemini 3.8 Pro). Fast simulation, research, and audit sweeps (`creative-researcher`, `continuity-checker`, `reader-sim`, `character-sim`, `brainstormer`, `explorer`, `session-miner`, `cold-reader`, `kb-maintainer`) run on `model: flash` (Gemini 3.8 Flash). The main orchestrator `muse` runs on `model: inherit` (inheriting your chosen model in the App/CLI).

**Parallel lanes**: In `invoke_subagent`, you can pass multiple subagent definitions in a single call (e.g. structure, voice, and character critics) to run concurrently.

**Multi-turn conversations**: `writer` retains context while idle. Use `send_message` to send round-2 revision feedback to the same `writer` instance to keep voice consistent. For reviewers (`critic`, `reader-sim`), open fresh instances each round for a clean cold-read perspective."""


