# antigravity/agents.toml
# Source configuration for building Antigravity 2.0 agents from plugin/claude/agents/

[defaults]
commandExecutionPolicy = "sandbox"
mainAgent = false
subagent = true
model = "flash"

[agents.muse]
model = "inherit"
mainAgent = true
subagent = false
role = "orchestrator"
description = "Author-facing creative partner for all story work: talks through the story, plans and drafts it with the author, spawns critique, continuity, reader-sim, research and knowledge-capture lanes, and owns the verdict on each draft. Select as your main agent for story sessions."
tools = [
  "view_file",
  "list_dir",
  "find_by_name",
  "grep_search",
  "write_to_file",
  "replace_file_content",
  "multi_replace_file_content",
  "run_command",
  "search_web",
  "read_url_content",
  "invoke_subagent",
  "manage_subagents",
  "send_message",
  "ask_question",
]
skills = [
  "skills/creative-writing-muse",
  "skills/story-workflow",
  "skills/story-planning",
  "skills/creative-writing-craft",
  "skills/writing-principles",
  "skills/story-memory",
  "skills/intent-modeling",
  "skills/llm-writing",
  "skills/writing-staffing",
]
optional_skills = [
  "skills/story-review",
  "skills/reader-sim",
  "skills/character-sim",
  "skills/creative-research",
  "skills/shared-dao",
  "skills/grill-with-docs",
  "skills/structured-artifact",
]
subagents = [
  "brainstormer",
  "character-sim",
  "cold-reader",
  "continuity-checker",
  "critic",
  "creative-researcher",
  "explorer",
  "kb-lead",
  "kb-maintainer",
  "outliner",
  "reader-sim",
  "session-miner",
  "style-creator",
  "writer",
]

[agents.writer]
model = "flash"
mainAgent = true
subagent = true
role = "producer"
description = "Writes production prose in one mode: fresh draft, revision, bridge, alternate take, or line polish. Pass the brief or revision notes, the mode, the target path, and the style, character-state and canon files; returns the mode used, the judgment calls it made, and any contradiction with character state."
tools = [
  "view_file",
  "list_dir",
  "find_by_name",
  "grep_search",
  "write_to_file",
  "replace_file_content",
  "multi_replace_file_content",
]
skills = [
  "skills/creative-writing-craft",
  "skills/writing-principles",
  "skills/story-memory",
]
optional_skills = [
  "skills/story-review",
  "skills/character-sim",
  "skills/shared-dao",
]

[agents.critic]
model = "flash"
mainAgent = false
subagent = true
role = "reviewer"
description = "Diagnoses a draft in one review lane: a focus area (structure, character, voice, prose, continuity) for adversarial depth, or an edit level (editorial review for a holistic priority order across concerns, developmental, line edit, copyedit, proofreading). Pass the draft, the lane, and the context files that lane judges against; returns findings anchored to quoted passages, or the edit level's memo."
tools = [
  "view_file",
  "list_dir",
  "find_by_name",
  "grep_search",
]
skills = [
  "skills/story-review",
  "skills/writing-principles",
  "skills/story-memory",
]
optional_skills = [
  "skills/creative-writing-craft",
  "skills/shared-dao",
]

[agents.outliner]
model = "flash"
mainAgent = true
subagent = true
role = "planner"
description = "Structural story architect and beat sheet planner. Transforms creative vision and premise into cohesive narrative arcs, act breakdowns, chapter beat outlines, and scene structures."
tools = [
  "view_file",
  "list_dir",
  "find_by_name",
  "grep_search",
