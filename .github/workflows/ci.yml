name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Pinned: `mars check` compares the committed `plugin/` tree against the
      # Mars that built it, so CI must run the version authors build with.
      - name: Install Mars
        run: |
          uv tool install "mars-agents==0.27.4"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate package
        run: mars check

      - name: Check committed plugin output is up to date
        run: |
          mars build plugin
          python3 scripts/build_antigravity.py
          changed=$(git diff --name-only -- plugin .claude-plugin .cursor-plugin package.json)
          untracked=$(git ls-files --others --exclude-standard -- plugin .claude-plugin .cursor-plugin package.json)
          if [ -n "$changed$untracked" ]; then
            echo "::error::Committed plugin output is stale. Run 'mars build plugin' followed by 'python3 scripts/build_antigravity.py' and commit the result."
            printf '%s\n' "$changed" "$untracked"
            exit 1
          fi

      - name: Check every agent and skill reference resolves
        run: python3 scripts/check_refs.py

      - name: Validate Claude plugin (manifest + components)
        run: claude plugins validate plugin/claude

      - name: Validate Claude marketplace catalog
        run: claude plugins validate .claude-plugin/marketplace.json

      - name: Validate YAML frontmatter
        run: |
          error=0
          for f in agents/*.md skills/*/SKILL.md; do
            if [ -f "$f" ]; then
              if ! head -1 "$f" | grep -q '^---'; then
                echo "::error file=$f::Missing YAML frontmatter"
                error=1
              fi
            fi
          done
          exit $error

      - name: Build Claude.ai skill packages
        run: python3 scripts/create_skill_zips.py

  antigravity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Antigravity plugin
        run: python3 scripts/build_antigravity.py

      - name: Check committed Antigravity plugin output is up to date
        run: |
          changed=$(git diff --name-only -- plugin/antigravity)
          untracked=$(git ls-files --others --exclude-standard -- plugin/antigravity)
          if [ -n "$changed$untracked" ]; then
            echo "::error::Committed plugin/antigravity output is stale. Run 'python3 scripts/build_antigravity.py' and commit."
            printf '%s\n' "$changed" "$untracked"
            exit 1
          fi

      - name: Run Antigravity integrity checker
        run: python3 scripts/check_antigravity.py

      - name: Run 4-Tier E2E test suite
        run: python3 tests/e2e_antigravity_test.py

      - name: Run adversarial test suite
        run: python3 tests/test_m1_adversarial.py

      - name: Run delegation flow test suite
        run: python3 tests/test_delegation_flow.py

      - name: Validate Antigravity plugin with agy CLI
        run: |
          if command -v agy >/dev/null 2>&1; then
            agy plugin validate plugin/antigravity --strict
            TMP_HOME=$(mktemp -d)
            HOME="$TMP_HOME" agy plugin install ./plugin/antigravity
            HOME="$TMP_HOME" agy plugin list --json
            rm -rf "$TMP_HOME"
          else
            echo "agy CLI not found on PATH; skipping agy CLI validation."
          fi
